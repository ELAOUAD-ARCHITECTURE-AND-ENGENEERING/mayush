<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Modern Moroccan interior design material palette</title>
  <desc id="desc">A design board with zellij tile, carved wood, wool textile, plaster wall, brass lighting, and olive greenery for a modern Moroccan room.</desc>
  <rect width="1200" height="675" fill="#f3efe7"/>
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#263d35">Modern Moroccan Palette</text>
  <g transform="translate(70 115)">
    <rect width="300" height="210" rx="18" fill="#0e7c73"/>
    <path d="M0 70h300M0 140h300M100 0v210M200 0v210" stroke="#f7f4ef" stroke-width="5"/>
    <text x="38" y="250" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#263d35">Handmade zellij</text>
  </g>
  <g transform="translate(450 115)">
    <rect width="300" height="210" rx="18" fill="#8a5a3b"/>
    <path d="M40 45c85 55 130-55 220 5M35 120c90 60 150-50 230 10" fill="none" stroke="#cba780" stroke-width="9"/>
    <text x="55" y="250" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#263d35">Carved wood</text>
  </g>
  <g transform="translate(830 115)">
    <rect width="300" height="210" rx="18" fill="#d9c9a8"/>
    <path d="M45 45h210v120H45z" fill="#ffffff" opacity=".35"/>
    <path d="M65 70l70 70 95-95" fill="none" stroke="#c76f5d" stroke-width="12"/>
    <text x="64" y="250" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#263d35">Wool textile</text>
  </g>
  <rect x="105" y="455" width="210" height="84" rx="42" fill="#e6ddcf"/>
  <text x="145" y="507" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#263d35">Lime plaster</text>
  <rect x="395" y="455" width="210" height="84" rx="42" fill="#b68b44"/>
  <text x="455" y="507" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Brass</text>
  <rect x="685" y="455" width="210" height="84" rx="42" fill="#6d7d47"/>
  <text x="745" y="507" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Olive</text>
