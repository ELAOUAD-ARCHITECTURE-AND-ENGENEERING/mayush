<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Small living room interior design layout infographic</title>
  <desc id="desc">A compact apartment living room plan showing clear walkways, floating furniture, vertical storage, layered lighting, and a mirror zone.</desc>
  <rect width="1200" height="675" fill="#f7f4ef"/>
  <rect x="70" y="70" width="1060" height="535" rx="18" fill="#fffdf9" stroke="#2f3a35" stroke-width="4"/>
  <text x="90" y="50" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#2f3a35">Small Living Room Plan</text>
  <rect x="155" y="180" width="330" height="95" rx="18" fill="#c76f5d"/>
  <text x="220" y="235" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Slim sofa</text>
  <rect x="530" y="225" width="175" height="115" rx="16" fill="#d8c7a3"/>
  <text x="570" y="290" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#2f3a35">Table</text>
  <rect x="795" y="160" width="190" height="320" rx="10" fill="#496b63"/>
  <text x="826" y="325" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Vertical storage</text>
  <line x1="150" y1="430" x2="730" y2="430" stroke="#b4a269" stroke-width="18" stroke-linecap="round" stroke-dasharray="18 24"/>
  <text x="255" y="475" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2f3a35">Keep a clear walkway</text>
  <circle cx="180" cy="355" r="52" fill="#f2b84b"/>
  <text x="150" y="363" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2f3a35">Lamp</text>
  <rect x="1000" y="210" width="55" height="185" rx="26" fill="#b7d2d8"/>
  <text x="930" y="425" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#2f3a35">Mirror zone</text>
</svg>
