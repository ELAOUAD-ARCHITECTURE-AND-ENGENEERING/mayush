name: Marketplace CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: mayush_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, mysql, bcmath, gd, zip
        coverage: none

    - uses: actions/checkout@v3

    - name: Copy .env
      run: |
        php -r "file_exists('.env') || copy('.env.example', '.env');"
        sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
        sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
        sed -i 's#^DB_DATABASE=.*#DB_DATABASE=database/database.sqlite#' .env
        sed -i 's/^CACHE_DRIVER=.*/CACHE_DRIVER=array/' .env
        sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=array/' .env
        sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
        sed -i 's/^ONESSTA_ENABLED=.*/ONESSTA_ENABLED=false/' .env

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite

    - name: Execute tests (Unit and Feature tests) via PHPUnit
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test
