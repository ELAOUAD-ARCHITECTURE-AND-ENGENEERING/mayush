name: "🛒 MAYUSH — PRODUCTION DEPLOY"

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: "🚀 Deploy to Production"
    runs-on: ubuntu-latest
    
    steps:
      - name: "📂 Checkout Repository"
        uses: actions/checkout@v4

      - name: "📂 SSH — Deploying to Production Server"
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT }}
          request_pty: true
          script_stop: false
          envs: DEPLOY_DB_PASSWORD,DEPLOY_DB_USER,GITHUB_TOKEN
          script: |
            set -euo pipefail
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  MAYUSHDESIGN — DEPLOY STARTED"
            echo "  $(date '+%Y-%m-%d %H:%M:%S')"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # ── [1/6] Zero-Touch Infrastructure Provisioning ────────────────
            echo ""
            echo "▶ [1/6] Running Zero-Touch Infrastructure Provisioning..."
            
            # Setup dependencies
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq redis-server supervisor
            
            # Auto-configure .env & Redis Password
            ENV_FILE="/home/mayushdesign/public_html/.env"
            if [ -f "$ENV_FILE" ]; then
              # Get current password or generate one
              CURRENT_REDIS_PASS=$(grep '^REDIS_PASSWORD=' "$ENV_FILE" | cut -d '=' -f 2- | tr -d '"' || true)
              if [ -z "$CURRENT_REDIS_PASS" ] || [ "$CURRENT_REDIS_PASS" == "null" ] || [ "$CURRENT_REDIS_PASS" == "YOUR_COMPLEX_REDIS_PASSWORD" ]; then
                NEW_REDIS_PASS=$(openssl rand -hex 16)
                # Overwrite .env rules securely
                sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=redis/' "$ENV_FILE"
                
                if grep -q "^REDIS_CLIENT=" "$ENV_FILE"; then
                  sed -i 's/^REDIS_CLIENT=.*/REDIS_CLIENT=phpredis/' "$ENV_FILE"
                else
                  echo "REDIS_CLIENT=phpredis" >> "$ENV_FILE"
                fi

                if grep -q "^REDIS_QUEUE_DB=" "$ENV_FILE"; then
                  sed -i 's/^REDIS_QUEUE_DB=.*/REDIS_QUEUE_DB=1/' "$ENV_FILE"
                else
                  echo "REDIS_QUEUE_DB=1" >> "$ENV_FILE"
                fi
                
                # Replace REDIS_PASSWORD exactly
                if grep -q "^REDIS_PASSWORD=" "$ENV_FILE"; then
                  sed -i "s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=\"$NEW_REDIS_PASS\"/" "$ENV_FILE"
                else
                  echo "REDIS_PASSWORD=\"$NEW_REDIS_PASS\"" >> "$ENV_FILE"
                fi
                CURRENT_REDIS_PASS="$NEW_REDIS_PASS"
                echo "  ✔ Generated and injected secure REDIS_PASSWORD into .env"
              else
                echo "  ✔ Secure REDIS_PASSWORD already exists in .env"
              fi
            fi

            # Harden Redis
            REDIS_CONF="/etc/redis/redis.conf"
            sudo touch "$REDIS_CONF" 
            sudo sed -i '/^requirepass /d' "$REDIS_CONF"
            sudo sed -i '/^bind /d' "$REDIS_CONF"
            sudo sed -i '/^maxmemory /d' "$REDIS_CONF"
            sudo sed -i '/^maxmemory-policy /d' "$REDIS_CONF"
            echo -e "\nbind 127.0.0.1\nmaxmemory 512mb\nmaxmemory-policy allkeys-lru\nrequirepass $CURRENT_REDIS_PASS" | sudo tee -a "$REDIS_CONF" >/dev/null
            sudo systemctl restart redis-server || true
            sudo systemctl enable redis-server || true
            echo "  ✔ Redis daemon hardened safely."

            # Construct Horizon configuration
            SUP_CONF="/etc/supervisor/conf.d/mayush-horizon.conf"
            sudo touch "$SUP_CONF"
            echo "[program:mayush-horizon]" | sudo tee "$SUP_CONF" >/dev/null
            echo "process_name=%(program_name)s" | sudo tee -a "$SUP_CONF" >/dev/null
            echo "command=php8.2 /home/mayushdesign/public_html/artisan horizon" | sudo tee -a "$SUP_CONF" >/dev/null
            echo "autostart=true" | sudo tee -a "$SUP_CONF" >/dev/null
            echo "autorestart=true" | sudo tee -a "$SUP_CONF" >/dev/null
            echo "user=mayushdesign" | sudo tee -a "$SUP_CONF" >/dev/null
            echo "redirect_stderr=true" | sudo tee -a "$SUP_CONF" >/dev/null
            echo "stdout_logfile=/home/mayushdesign/public_html/storage/logs/horizon.log" | sudo tee -a "$SUP_CONF" >/dev/null
            echo "stopwaitsecs=3600" | sudo tee -a "$SUP_CONF" >/dev/null
            
            sudo supervisorctl reread || true
            sudo supervisorctl update || true
            sudo supervisorctl start mayush-horizon || true
            echo "  ✔ Supervisor Horizon daemon safely updated."

            # ── [2/6] Pull latest code ──────────────────────────────
            echo ""
            echo "▶ [2/6] Pulling latest code from GitHub..."
            cd /home/mayushdesign/public_html
            
            # Record current version for logging
            PRE_DEPLOY_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "none")
            echo "  🔹 Current Commit: $PRE_DEPLOY_COMMIT"

            # Bypass Git CVE-2022-24765 dubious ownership block
            git config --global --add safe.directory /home/mayushdesign/public_html
            
            # Authenticate using GitHub Actions token
            git remote set-url origin https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git
            
            # Force fetch and hard reset to ensure 1:1 synchronization
            git fetch --all --prune
            git reset --hard origin/main
            
            # Verify new version
            POST_DEPLOY_COMMIT=$(git rev-parse --short HEAD)
            echo "  ✔ Code updated to: $POST_DEPLOY_COMMIT"
            
            # Restore safe origin URL
            git remote set-url origin https://github.com/${{ github.repository }}.git

            # ── [3/6] Generating Version Manifest ───────────────────
            echo ""
            echo "▶ [3/6] Generating Version Manifest..."
            echo "{\"commit\": \"${{ github.sha }}\", \"short_sha\": \"${POST_DEPLOY_COMMIT}\", \"timestamp\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\", \"branch\": \"${{ github.ref_name }}\"}" > public/version.json
            echo "✔ public/version.json created"

            # ── [4/6] Installing PHP dependencies ───────────────────
            echo ""
            echo "▶ [4/6] Installing PHP dependencies..."
            
            # CACHE POISONING FIX: Composer triggers post-autoload hooks (like package:discover) which boot Laravel.
            # If the config cache has poisoned Redis credentials, Composer fails. Clear it FIRST.
            rm -f /home/mayushdesign/public_html/bootstrap/cache/*.php
            
            php8.2 $(which composer) install \
              --no-dev \
              --optimize-autoloader \
              --no-interaction \
              --prefer-dist
            echo "✔ Composer done"

            # ── [5/6] Laravel Deploy & Cache Clearing ──────────────
            echo ""
            echo "▶ [5/6] Running Laravel deploy & cache clearing..."
            
            # Primary cache clear
            php8.2 artisan optimize:clear
            php8.2 artisan view:clear
            php8.2 artisan migrate --force
            php8.2 artisan queue:restart
            php8.2 artisan horizon:terminate
            
            # Run the server's specific ENV and cache script
            sudo -E /usr/local/bin/deploy_mayush_env_and_cache.sh
            
            echo "✔ Deploy & cache clearing finished"

            # ── [6/6] AI Service Setup (Isolated) ──────────────────
            echo ""
            echo "▶ [6/6] Setting up AI Visual Search Service..."
            
            SETUPSH="/tmp/mayush_ai_setup.sh"
            cat << 'EOF' > $SETUPSH
            #!/bin/bash
            set -x  # Turn on verbose execution logging to trace the crash
            
            # Removed set -euo pipefail to avoid silent false-positive crashes on conditional commands
            
            AI_DIR="/home/mayushdesign/public_html/ai_service"
            mkdir -p "$AI_DIR"
            AI_LOG="$AI_DIR/ai_service.log"
            AI_PID="$AI_DIR/ai_service.pid"
            AI_VENV="$AI_DIR/venv"
            AI_HASH_FILE="$AI_DIR/.requirements.hash"
            
            echo "  🔍 Checking Python environment..."
            if ! command -v python3 &>/dev/null; then
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3
            fi
            
            MISSING_PKGS=""
            dpkg -s python3-venv &>/dev/null || MISSING_PKGS="python3-venv $MISSING_PKGS"
            dpkg -s python3-pip &>/dev/null || MISSING_PKGS="python3-pip $MISSING_PKGS"
            
            if [[ -n "$MISSING_PKGS" ]]; then
              echo "  📦 Installing missing packages: $MISSING_PKGS"
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq $MISSING_PKGS || \
              (echo "  🔄 Direct install failed, trying with update..." && \
               sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq && \
               sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq $MISSING_PKGS)
            fi
            
            echo "  ✔ Python environment ready: $(python3 --version 2>&1)"
            
            if [[ ! -d "$AI_VENV" ]]; then
              echo "  📦 Creating Python virtual environment..."
              python3 -m venv "$AI_VENV"
            fi
            
            if [[ ! -f "$AI_DIR/requirements.txt" ]]; then
              echo "  ⚠ requirements.txt missing — skipping dependency install"
              AI_STATUS="missing_requirements"
            else
              CURRENT_HASH=$(sha256sum "$AI_DIR/requirements.txt" | awk '{print $1}')
              if [[ -f "$AI_HASH_FILE" ]] && [[ "$(cat "$AI_HASH_FILE")" == "$CURRENT_HASH" ]]; then
                echo "  ✔ Dependencies unchanged — skipping pip install"
                AI_STATUS="ready"
              else
                echo "  📥 Installing Python dependencies (may take a moment)..."
                INSTALL_OK=false
                for attempt in 1 2 3; do
                  if "$AI_VENV/bin/pip" install -r "$AI_DIR/requirements.txt" --quiet 2>>"$AI_LOG"; then
                    echo "$CURRENT_HASH" > "$AI_HASH_FILE"
                    echo "  ✔ Dependencies installed (attempt $attempt)"
                    INSTALL_OK=true
                    break
                  fi
                  echo "  ⚠ pip install failed (attempt $attempt/3) — retrying..."
                  sleep 5
                done
                if [[ "$INSTALL_OK" == "true" ]]; then 
                  AI_STATUS="ready"
                else 
                  echo "  ❌ pip install failed"
                  AI_STATUS="deps_failed"
                fi
              fi
            fi
            
            if [[ "$AI_STATUS" != "deps_failed" ]]; then
              if [[ -f "$AI_PID" ]]; then
                OLD_PID=$(cat "$AI_PID")
                if kill -0 "$OLD_PID" 2>/dev/null; then
                  echo "  🔄 Restarting AI Service (PID $OLD_PID)..."
                  kill "$OLD_PID" 2>/dev/null || true
                  sleep 2
                  kill -0 "$OLD_PID" 2>/dev/null && kill -9 "$OLD_PID" 2>/dev/null || true
                fi
                rm -f "$AI_PID"
              fi
              
              echo "  🚀 Starting AI Visual Search Service..."
              nohup "$AI_VENV/bin/python" "$AI_DIR/app.py" >> "$AI_LOG" 2>&1 &
              echo $! > "$AI_PID"
              echo "  ✔ AI Service started successfully"
            fi
            EOF

            chmod +x $SETUPSH
            /bin/bash $SETUPSH
            rm $SETUPSH

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  ✔ DEPLOY COMPLETED SUCCESSFULLY"
            echo "  $(date '+%Y-%m-%d %H:%M:%S')"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: "📣 Send Telegram Notification"
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 Mayush Production Deploy
            Status: ${{ job.status }}
