name: "🛒 MAYUSH — PRODUCTION DEPLOY"

on:
  push:
    branches: [ "main" ]

jobs:
  quality_gate:
    name: "Quality Gate"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pcntl, pdo_sqlite, posix, redis, sqlite3, xml, zip
          coverage: none

      - name: "Validate Composer Manifest"
        run: composer validate --no-check-publish --strict

      - name: "Block Production Debug Artifacts"
        run: |
          ! grep -RInE '(^|[^A-Za-z0-9_])(dd|dump|ray|var_dump)[[:space:]]*\(' app routes resources --include='*.php'

      - name: "Install Dependencies"
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: "Prepare Laravel Environment"
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan optimize:clear

      - name: "Validate Routes"
        run: php artisan route:list

      - name: "Validate Config Cache"
        run: |
          php artisan config:cache
          php artisan config:clear

      - name: "Validate Route Cache"
        run: |
          php artisan route:cache
          php artisan route:clear

      - name: "Run Application Tests"
        run: php artisan test --stop-on-failure

  deploy:
    name: "🚀 Deploy to Production"
    runs-on: ubuntu-latest
    needs: quality_gate
    
    steps:
      - name: "📂 Checkout Repository"
        uses: actions/checkout@v4

      - name: "📂 SSH — Deploying to Production Server"
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONESSTA_ENABLED: ${{ secrets.ONESSTA_ENABLED }}
          ONESSTA_BASE_URL: ${{ secrets.ONESSTA_BASE_URL }}
          ONESSTA_TOKEN: ${{ secrets.ONESSTA_TOKEN }}
          ONESSTA_API_KEY: ${{ secrets.ONESSTA_API_KEY }}
          ONESSTA_CLIENT_ID: ${{ secrets.ONESSTA_CLIENT_ID }}
          ONESSTA_WEBHOOK_SECRET: ${{ secrets.ONESSTA_WEBHOOK_SECRET }}
          ONESSTA_WEBHOOK_API_KEY: ${{ secrets.ONESSTA_WEBHOOK_API_KEY }}
          ONESSTA_WEBHOOK_CALLBACKURL: ${{ secrets.ONESSTA_WEBHOOK_CALLBACKURL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT }}
          request_pty: true
          script_stop: false
          command_timeout: 30m
          envs: DEPLOY_DB_PASSWORD,DEPLOY_DB_USER,GITHUB_TOKEN,ONESSTA_ENABLED,ONESSTA_BASE_URL,ONESSTA_TOKEN,ONESSTA_API_KEY,ONESSTA_CLIENT_ID,ONESSTA_WEBHOOK_SECRET,ONESSTA_WEBHOOK_API_KEY,ONESSTA_WEBHOOK_CALLBACKURL
          script: |
            set -euo pipefail
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  MAYUSHDESIGN — DEPLOY STARTED"
            echo "  $(date '+%Y-%m-%d %H:%M:%S')"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            echo ""
            echo "▶ [1/5] Pulling latest code..."
            cd /home/mayushdesign/public_html
            
            # Record current version for logging
            PRE_DEPLOY_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "none")
            echo "  🔹 Current Commit: $PRE_DEPLOY_COMMIT"

            # Bypass Git CVE-2022-24765 dubious ownership block
            git config --global --add safe.directory /home/mayushdesign/public_html
            
            # Authenticate using GitHub Actions token
            git remote set-url origin https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git
            
            # Force fetch and hard reset to ensure 1:1 synchronization
            git fetch --all --prune
            git reset --hard origin/main
            
            # Verify new version
            POST_DEPLOY_COMMIT=$(git rev-parse --short HEAD)
            echo "  ✔ Code updated to: $POST_DEPLOY_COMMIT"
            
            # Restore safe origin URL
            git remote set-url origin https://github.com/${{ github.repository }}.git

            echo ""
            echo "▶ [2/5] Injecting ONESSTA Environment Variables..."
            ENV_FILE="/home/mayushdesign/public_html/.env"
            
            # Ensure .env exists
            [ -f "$ENV_FILE" ] || (echo ".env missing on server" && exit 1)

            # Remove old ONESSTA keys if they exist
            sed -i "/^ONESSTA_ENABLED=/d" "$ENV_FILE"
            sed -i "/^ONESSTA_BASE_URL=/d" "$ENV_FILE"
            sed -i "/^ONESSTA_TOKEN=/d" "$ENV_FILE"
            sed -i "/^ONESSTA_API_KEY=/d" "$ENV_FILE"
            sed -i "/^ONESSTA_CLIENT_ID=/d" "$ENV_FILE"
            sed -i "/^ONESSTA_WEBHOOK_SECRET=/d" "$ENV_FILE"
            sed -i "/^ONESSTA_WEBHOOK_API_KEY=/d" "$ENV_FILE"
            sed -i "/^ONESSTA_WEBHOOK_CALLBACKURL=/d" "$ENV_FILE"

            # Inject the secrets into .env
            printf "\nONESSTA_ENABLED=%s\nONESSTA_BASE_URL=%s\nONESSTA_TOKEN=%s\nONESSTA_API_KEY=%s\nONESSTA_CLIENT_ID=%s\nONESSTA_WEBHOOK_SECRET=%s\nONESSTA_WEBHOOK_API_KEY=%s\nONESSTA_WEBHOOK_CALLBACKURL=%s\n" \
              "$ONESSTA_ENABLED" "$ONESSTA_BASE_URL" "$ONESSTA_TOKEN" "$ONESSTA_API_KEY" "$ONESSTA_CLIENT_ID" "$ONESSTA_WEBHOOK_SECRET" "$ONESSTA_WEBHOOK_API_KEY" "$ONESSTA_WEBHOOK_CALLBACKURL" >> "$ENV_FILE"
            
            echo "✔ Environment Variables Injected"

            echo ""
            echo "▶ [3/5] Cleaning Poisoned Caches BEFORE Composer..."
            rm -f bootstrap/cache/*.php

            echo ""
            echo "▶ [4/5] Installing Dependencies..."
            php8.2 $(which composer) install \
              --no-dev \
              --optimize-autoloader \
              --no-interaction \
              --prefer-dist
            echo "✔ Composer done"

            echo ""
            echo "▶ [4/5] Pre-Flight Redis Connectivity Validation..."
            
            ENV_FILE="/home/mayushdesign/public_html/.env"
            
            REDIS_PASS=$(grep '^REDIS_PASSWORD=' "$ENV_FILE" | cut -d '=' -f2- | tr -d '\r' | sed 's/^"//;s/"$//')
            REDIS_HOST=$(grep '^REDIS_HOST=' "$ENV_FILE" | cut -d '=' -f2- | tr -d '\r' | sed 's/^"//;s/"$//' || true)
            REDIS_PORT=$(grep '^REDIS_PORT=' "$ENV_FILE" | cut -d '=' -f2- | tr -d '\r' | sed 's/^"//;s/"$//' || true)
            
            REDIS_HOST="${REDIS_HOST:-127.0.0.1}"
            REDIS_PORT="${REDIS_PORT:-6379}"
            
            if [ -z "$REDIS_PASS" ]; then
              echo "REDIS_FAIL: REDIS_PASSWORD is empty in .env"
              exit 1
            fi
            
            if ! command -v redis-cli >/dev/null 2>&1; then
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq redis-tools
            fi
            
            if ! redis-cli -h "$REDIS_HOST" -p "$REDIS_PORT" -a "$REDIS_PASS" ping | grep -q PONG; then
              echo "REDIS_FAIL: Redis authentication failed for ${REDIS_HOST}:${REDIS_PORT}"
              exit 1
            fi
            
            echo "✔ Redis connectivity validated successfully"

            echo ""
            echo "▶ [5/5] Deploying Application..."
            php8.2 artisan optimize:clear
            php8.2 artisan view:clear

            echo "Creating pre-migration database backup..."
            DB_HOST=$(grep '^DB_HOST=' "$ENV_FILE" | cut -d '=' -f2- | tr -d '\r' | sed 's/^"//;s/"$//')
            DB_PORT=$(grep '^DB_PORT=' "$ENV_FILE" | cut -d '=' -f2- | tr -d '\r' | sed 's/^"//;s/"$//')
            DB_DATABASE=$(grep '^DB_DATABASE=' "$ENV_FILE" | cut -d '=' -f2- | tr -d '\r' | sed 's/^"//;s/"$//')
            DB_USERNAME=$(grep '^DB_USERNAME=' "$ENV_FILE" | cut -d '=' -f2- | tr -d '\r' | sed 's/^"//;s/"$//')
            DB_PASSWORD=$(grep '^DB_PASSWORD=' "$ENV_FILE" | cut -d '=' -f2- | tr -d '\r' | sed 's/^"//;s/"$//')
            BACKUP_DIR="/home/mayushdesign/db-backups"
            if [ -z "$DB_DATABASE" ] || [ -z "$DB_USERNAME" ]; then
              echo "DB_BACKUP_FAIL: DB_DATABASE and DB_USERNAME must be set in .env"
              exit 1
            fi
            if ! command -v mysqldump >/dev/null 2>&1; then
              echo "DB_BACKUP_FAIL: mysqldump is not installed on the production server"
              exit 1
            fi
            mkdir -p "$BACKUP_DIR"
            BACKUP_FILE="$BACKUP_DIR/${DB_DATABASE}-before-deploy-$(date -u +'%Y%m%d-%H%M%S').sql"
            MYSQL_PWD="$DB_PASSWORD" mysqldump --single-transaction --quick --routines --triggers -h "${DB_HOST:-127.0.0.1}" -P "${DB_PORT:-3306}" -u "$DB_USERNAME" "$DB_DATABASE" > "$BACKUP_FILE"
            test -s "$BACKUP_FILE"
            echo "Database backup created: $BACKUP_FILE"

            php8.2 artisan app:preflight-restore --require-redis --allow-pending-migrations --no-ansi
            php8.2 artisan migrate --force
            php8.2 artisan db:seed --class=BlogNavigationSeeder --force
            php8.2 artisan app:preflight-restore --require-redis --require-blog-navigation --no-ansi
            php8.2 artisan queue:restart
            php8.2 artisan horizon:terminate
            
            # Generate manifest directly
            echo "{\"commit\": \"${{ github.sha }}\", \"short_sha\": \"${POST_DEPLOY_COMMIT}\", \"timestamp\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\", \"branch\": \"${{ github.ref_name }}\"}" > public/version.json
            
            # Run the server's specific ENV and cache script
            sudo -E /usr/local/bin/deploy_mayush_env_and_cache.sh
            
            echo "✔ Deploy & cache clearing finished"

            # ── [6/6] AI Service Setup (Isolated) ──────────────────
            echo ""
            echo "▶ [6/6] Setting up AI Visual Search Service..."
            
            SETUPSH="/tmp/mayush_ai_setup.sh"
            cat << 'EOF' > $SETUPSH
            #!/bin/bash
            set -x  # Turn on verbose execution logging to trace the crash
            
            # Removed set -euo pipefail to avoid silent false-positive crashes on conditional commands
            
            AI_DIR="/home/mayushdesign/public_html/ai_service"
            mkdir -p "$AI_DIR"
            AI_LOG="$AI_DIR/ai_service.log"
            AI_PID="$AI_DIR/ai_service.pid"
            AI_VENV="$AI_DIR/venv"
            AI_HASH_FILE="$AI_DIR/.requirements.hash"
            
            echo "  🔍 Checking Python environment..."
            if ! command -v python3 &>/dev/null; then
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3
            fi
            
            MISSING_PKGS=""
            dpkg -s python3-venv &>/dev/null || MISSING_PKGS="python3-venv $MISSING_PKGS"
            dpkg -s python3-pip &>/dev/null || MISSING_PKGS="python3-pip $MISSING_PKGS"
            
            if [[ -n "$MISSING_PKGS" ]]; then
              echo "  📦 Installing missing packages: $MISSING_PKGS"
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq $MISSING_PKGS || \
              (echo "  🔄 Direct install failed, trying with update..." && \
               sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq && \
               sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq $MISSING_PKGS)
            fi
            
            echo "  ✔ Python environment ready: $(python3 --version 2>&1)"
            
            # ── Validate or rebuild the virtual environment ──
            VENV_HEALTHY=false
            if [[ -d "$AI_VENV" ]]; then
              if "$AI_VENV/bin/pip" --version &>/dev/null; then
                echo "  ✔ Virtual environment is healthy"
                VENV_HEALTHY=true
              else
                echo "  ⚠ Virtual environment is corrupted (pip missing/broken) — rebuilding..."
                rm -rf "$AI_VENV"
              fi
            fi
            
            if [[ "$VENV_HEALTHY" == "false" ]]; then
              echo "  📦 Creating Python virtual environment..."
              python3 -m venv "$AI_VENV"
              chown -R mayushdesign:mayushdesign "$AI_VENV"
              echo "  ✔ Virtual environment created"
            fi
            
            if [[ ! -f "$AI_DIR/requirements.txt" ]]; then
              echo "  ⚠ requirements.txt missing — skipping dependency install"
              AI_STATUS="missing_requirements"
            else
              CURRENT_HASH=$(sha256sum "$AI_DIR/requirements.txt" | awk '{print $1}')
              if [[ -f "$AI_HASH_FILE" ]] && [[ "$(cat "$AI_HASH_FILE")" == "$CURRENT_HASH" ]] && [[ "$VENV_HEALTHY" == "true" ]]; then
                echo "  ✔ Dependencies unchanged — skipping pip install"
                AI_STATUS="ready"
              else
                echo "  📥 Installing Python dependencies (may take a moment)..."
                PIP_TIMEOUT=600  # 10 minutes per attempt
                INSTALL_OK=false
                for attempt in 1 2 3; do
                  echo "  ⏳ Attempt $attempt/3 (timeout: ${PIP_TIMEOUT}s)..."
                  # Use Linux timeout command to kill pip if it hangs
                  # Exit code 124 = timed out, 137 = SIGKILL after timeout
                  if timeout --signal=TERM --kill-after=30 $PIP_TIMEOUT \
                    "$AI_VENV/bin/pip" install -r "$AI_DIR/requirements.txt" --no-cache-dir 2>&1 | tee -a "$AI_LOG"; then
                    echo "$CURRENT_HASH" > "$AI_HASH_FILE"
                    echo "  ✔ Dependencies installed (attempt $attempt)"
                    INSTALL_OK=true
                    break
                  else
                    PIP_EXIT=$?
                    if [[ $PIP_EXIT -eq 124 ]] || [[ $PIP_EXIT -eq 137 ]]; then
                      echo "  ⏰ pip install timed out after ${PIP_TIMEOUT}s (attempt $attempt/3)"
                    else
                      echo "  ⚠ pip install failed with exit code $PIP_EXIT (attempt $attempt/3)"
                    fi
                  fi
                  echo "  🔄 Retrying in 5 seconds..."
                  sleep 5
                done
                if [[ "$INSTALL_OK" == "true" ]]; then 
                  AI_STATUS="ready"
                else 
                  echo "  ❌ pip install failed — check $AI_LOG for details"
                  AI_STATUS="deps_failed"
                fi
              fi
            fi
            
            if [[ "$AI_STATUS" != "deps_failed" ]]; then
              if [[ -f "$AI_PID" ]]; then
                OLD_PID=$(cat "$AI_PID")
                if kill -0 "$OLD_PID" 2>/dev/null; then
                  echo "  🔄 Restarting AI Service (PID $OLD_PID)..."
                  kill "$OLD_PID" 2>/dev/null || true
                  sleep 2
                  kill -0 "$OLD_PID" 2>/dev/null && kill -9 "$OLD_PID" 2>/dev/null || true
                fi
                rm -f "$AI_PID"
              fi
              
              echo "  🚀 Starting AI Visual Search Service..."
              nohup "$AI_VENV/bin/python" "$AI_DIR/app.py" >> "$AI_LOG" 2>&1 &
              echo $! > "$AI_PID"
              echo "  ✔ AI Service started successfully"
            fi
            EOF

            chmod +x $SETUPSH
            /bin/bash $SETUPSH
            rm $SETUPSH

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  ✔ DEPLOY COMPLETED SUCCESSFULLY"
            echo "  $(date '+%Y-%m-%d %H:%M:%S')"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: "📣 Send Telegram Notification"
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 Mayush Production Deploy
            Status: ${{ job.status }}
