name: "🛒 MAYUSH — PRODUCTION DEPLOY"

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: "🚀 Deploy to Production"
    runs-on: ubuntu-latest
    
    steps:
      - name: "📂 Checkout Repository"
        uses: actions/checkout@v4

      - name: "📂 SSH — Deploying to Production Server"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          port: ${{ secrets.PORT }}
          request_pty: true
          script_stop: true
          envs: DEPLOY_DB_PASSWORD,DEPLOY_DB_USER
          script: |
            set -euo pipefail
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  MAYUSHDESIGN — DEPLOY STARTED"
            echo "  $(date '+%Y-%m-%d %H:%M:%S')"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # ── [1/3] Pull latest code ──────────────────────────────
            echo ""
            echo "▶ [1/3] Pulling latest code from GitHub..."
            cd /home/mayushdesign/public_html
            
            # Bypass Git CVE-2022-24765 dubious ownership block
            git config --global --add safe.directory /home/mayushdesign/public_html
            
            git pull origin main
            echo "✔ Code updated"

            # ── [2/3] Installing PHP dependencies ───────────────────
            echo ""
            echo "▶ [2/3] Installing PHP dependencies..."
            php8.2 $(which composer) install \
              --no-dev \
              --optimize-autoloader \
              --no-interaction \
              --prefer-dist
            echo "✔ Composer done"

            # ── [3/4] Laravel deploy script ─────────────────────────
            echo ""
            echo "▶ [3/4] Running Laravel deploy script..."
            sudo -E /usr/local/bin/deploy_mayush_env_and_cache.sh
            echo "✔ Deploy script finished"

            # ── [4/4] AI Service Setup (Isolated) ──────────────────
            echo ""
            echo "▶ [4/4] Setting up AI Visual Search Service..."
            
            SETUPSH="/tmp/mayush_ai_setup.sh"
            cat << 'EOF' > $SETUPSH
            #!/bin/bash
            set -euo pipefail
            
            AI_DIR="/home/mayushdesign/public_html/ai_service"
            mkdir -p "$AI_DIR"
            AI_LOG="$AI_DIR/ai_service.log"
            AI_PID="$AI_DIR/ai_service.pid"
            AI_VENV="$AI_DIR/venv"
            AI_HASH_FILE="$AI_DIR/.requirements.hash"
            
            echo "  🔍 Checking Python environment..."
            if ! command -v python3 &>/dev/null; then
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3
            fi
            
            MISSING_PKGS=""
            dpkg -s python3-venv &>/dev/null || MISSING_PKGS="python3-venv $MISSING_PKGS"
            dpkg -s python3-pip &>/dev/null || MISSING_PKGS="python3-pip $MISSING_PKGS"
            
            if [[ -n "$MISSING_PKGS" ]]; then
              echo "  📦 Installing missing packages: $MISSING_PKGS"
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq $MISSING_PKGS || \
              (echo "  🔄 Direct install failed, trying with update..." && \
               sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq && \
               sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq $MISSING_PKGS)
            fi
            
            echo "  ✔ Python environment ready: $(python3 --version 2>&1)"
            
            if [[ ! -d "$AI_VENV" ]]; then
              echo "  📦 Creating Python virtual environment..."
              python3 -m venv "$AI_VENV"
            fi
            
            if [[ ! -f "$AI_DIR/requirements.txt" ]]; then
              echo "  ⚠ requirements.txt missing — skipping dependency install"
              AI_STATUS="missing_requirements"
            else
              CURRENT_HASH=$(sha256sum "$AI_DIR/requirements.txt" | awk '{print $1}')
              if [[ -f "$AI_HASH_FILE" ]] && [[ "$(cat "$AI_HASH_FILE")" == "$CURRENT_HASH" ]]; then
                echo "  ✔ Dependencies unchanged — skipping pip install"
                AI_STATUS="ready"
              else
                echo "  📥 Installing Python dependencies (may take a moment)..."
                INSTALL_OK=false
                for attempt in 1 2 3; do
                  if "$AI_VENV/bin/pip" install -r "$AI_DIR/requirements.txt" --quiet 2>>"$AI_LOG"; then
                    echo "$CURRENT_HASH" > "$AI_HASH_FILE"
                    echo "  ✔ Dependencies installed (attempt $attempt)"
                    INSTALL_OK=true
                    break
                  fi
                  echo "  ⚠ pip install failed (attempt $attempt/3) — retrying..."
                  sleep 5
                done
                if [[ "$INSTALL_OK" == "true" ]]; then 
                  AI_STATUS="ready"
                else 
                  echo "  ❌ pip install failed"
                  AI_STATUS="deps_failed"
                fi
              fi
            fi
            
            if [[ "$AI_STATUS" != "deps_failed" ]]; then
              if [[ -f "$AI_PID" ]]; then
                OLD_PID=$(cat "$AI_PID")
                if kill -0 "$OLD_PID" 2>/dev/null; then
                  echo "  🔄 Restarting AI Service (PID $OLD_PID)..."
                  kill "$OLD_PID" 2>/dev/null || true
                  sleep 2
                  kill -0 "$OLD_PID" 2>/dev/null && kill -9 "$OLD_PID" 2>/dev/null || true
                fi
                rm -f "$AI_PID"
              fi
              
              echo "  🚀 Starting AI Visual Search Service..."
              nohup "$AI_VENV/bin/python" "$AI_DIR/app.py" >> "$AI_LOG" 2>&1 &
              echo $! > "$AI_PID"
              echo "  ✔ AI Service started successfully"
            fi
            EOF

            chmod +x $SETUPSH
            /bin/bash $SETUPSH
            rm $SETUPSH

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  ✔ DEPLOY COMPLETED SUCCESSFULLY"
            echo "  $(date '+%Y-%m-%d %H:%M:%S')"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
