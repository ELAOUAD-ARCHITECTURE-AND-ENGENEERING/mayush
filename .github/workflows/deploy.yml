name: Deploy Mayush to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚀 Secure SSH Deployment Trigger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "1. Jumping into project directory..."
            cd /home/mayushdesign/public_html
            
            echo "2. Securing local changes and pulling latest code from GitHub..."
            # Restore any file permission changes to prevent merge conflicts
            git restore .
            git pull origin main
            
            echo "3. Installing backend dependencies..."
            # Run composer install safely for production
            composer install --no-dev --optimize-autoloader --no-interaction
            
            echo "4. Triggering Global Server Deployment Script..."
            # The custom Mayush environment/cache deployer requested by the user
            sudo deploy_mayush_env_and_cache.sh
            
            echo "✅ Deployment Process Finished Successfully!"
